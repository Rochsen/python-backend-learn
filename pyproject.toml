[project]
name = "python-backend-learn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "notebook>=7.6.3",
    "openai>=3.35.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.54",
    "uvicorn==0.34.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
